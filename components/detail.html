<div class="py-4">

    <div class="md:col-span-5 flex flex-col justify-between space-y-6">

        <div>

          <h1 id="detail-nama" class="text-2xl md:text-4xl font-black uppercase tracking-tight text-zinc-900 leading-tight"></h1>
        </div>

        <div class="border-y border-zinc-100 py-3 grid grid-cols-2 gap-4">
          <div>

          </div>
        </div>

        <div class="text-xs text-zinc-500 leading-relaxed space-y-2">
          <p class="font-bold text-zinc-700">Fasilitas Termasuk:</p>
          <ul class="list-disc pl-4 space-y-1">
            <li>Asuransi perjalanan dasar</li>
            <li>Unit bersih & full bensin (ketentuan berlaku)</li>
            <li>Layanan darurat jalan raya 24 jam</li>

        </div>
      </div>

      <button id="detail-btn-booking" onclick="" class="w-full bg-[#ff5f00] text-white py-3.5 text-center font-black text-xs uppercase tracking-widest hover:bg-black transition-colors duration-200">
